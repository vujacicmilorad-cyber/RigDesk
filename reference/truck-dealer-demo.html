<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RigDesk demo for truck dealers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0ED; --surface:#FFFFFF; --ink:#14201B; --muted:#5A6962; --line:#D3DAD5;
  --sign:#0E5A43; --sign-ink:#FFFFFF; --sign-soft:#DCEBE4; --amber:#E9A100; --amber-soft:#FCF0CF;
  --red:#C2372C; --red-soft:#F7DEDB; --steel:#8B9892;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow','Segoe UI',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111815; --surface:#19231F; --ink:#E7EEEA; --muted:#9BAAA2; --line:#2B3833;
    --sign:#0B4A37; --sign-soft:#17382D; --amber:#F0B429; --amber-soft:#3A2F10; --red:#E2685D; --red-soft:#3B1D1A; --steel:#6F7D77;
  }
}
:root[data-theme="dark"]{
  --paper:#111815; --surface:#19231F; --ink:#E7EEEA; --muted:#9BAAA2; --line:#2B3833;
  --sign:#0B4A37; --sign-soft:#17382D; --amber:#F0B429; --amber-soft:#3A2F10; --red:#E2685D; --red-soft:#3B1D1A; --steel:#6F7D77;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px;line-height:1.15}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:216px 1fr;height:100%}
.side{background:var(--sign);color:var(--sign-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;padding:0 10px}
.dealer{font-size:13px;opacity:.8;padding:4px 10px 22px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:9px 10px;border-radius:8px;font-family:var(--display);font-size:20px;font-weight:500;border:2px solid transparent}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button[aria-current="page"]{border-color:#fff;font-weight:600}
.nav .count{font-family:var(--body);font-size:12px;font-weight:600;background:var(--amber);color:#1B1400;border-radius:10px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12.5px;opacity:.8;padding:0 10px;line-height:1.4}

.main{overflow:auto;padding:26px 30px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;border:1.5px solid var(--ink);background:var(--surface)}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.primary:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:18px}
.strip div{padding:14px 18px;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip .num{font-size:38px;line-height:1}
.strip span{color:var(--muted);font-size:13.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 8px}
.panel-h small{color:var(--muted)}
.list{list-style:none;margin:0;padding:0 8px 8px}
.list li button,.list li.static{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.list li button:hover{background:var(--paper)}
.mark{flex:none;width:12px;height:12px;margin-top:5px;transform:rotate(45deg);background:var(--amber);border-radius:2px}
.mark.red{background:var(--red)}
.tick{flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;background:var(--sign-soft);color:var(--sign);display:grid;place-items:center;font-size:11px;font-weight:700}
:root[data-theme="dark"] .tick{color:#7FD6B4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tick{color:#7FD6B4}}
.list time{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap;padding-left:8px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.money .panel{padding:16px 18px}
.money .num{font-size:34px;line-height:1.1}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--sign);background:var(--sign-soft);font-weight:600}
.rows{overflow:hidden}
.row{display:grid;grid-template-columns:86px 76px 1.6fr 1fr 1fr .6fr 1fr 110px;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--paper)}
.row.head{color:var(--muted);font-size:13px;padding-top:12px;padding-bottom:8px}
.r{text-align:right}
.plate{display:inline-block;font-family:var(--display);font-weight:600;font-size:16px;line-height:1;padding:5px 8px;border:1.5px solid var(--ink);border-radius:4px;background:
  radial-gradient(circle at 4px 4px,var(--steel) 1.3px,transparent 1.6px),
  radial-gradient(circle at calc(100% - 4px) 4px,var(--steel) 1.3px,transparent 1.6px),
  radial-gradient(circle at 4px calc(100% - 4px),var(--steel) 1.3px,transparent 1.6px),
  radial-gradient(circle at calc(100% - 4px) calc(100% - 4px),var(--steel) 1.3px,transparent 1.6px),var(--surface)}
.thumb{width:76px;height:38px;border-radius:6px;background:var(--paper);display:block}
.name{font-weight:600}
.name small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.st{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.st.available{background:var(--sign-soft);border-color:var(--sign)}
.st.hold{background:var(--amber-soft);border-color:var(--amber)}
.st.sold,.st.delivered{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.old{color:var(--red);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(10,20,16,.45);display:none;z-index:20}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow:auto;transform:translateX(102%);transition:transform .22s ease;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px))}
.drawer.on{transform:none}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.close{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;flex:none}
.hero{background:var(--paper);border-radius:10px;margin:14px 0;padding:10px 16px 0}
.hero svg{display:block;width:100%;height:auto}

.route{margin:18px 4px 8px;display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.route::before{content:"";position:absolute;left:8.33%;right:8.33%;top:9px;height:3px;background:var(--line)}
.route i{position:absolute;left:8.33%;top:9px;height:3px;background:var(--sign)}
.stop{position:relative;text-align:center;font-size:12.5px;color:var(--muted)}
.stop b{display:block;width:14px;height:14px;margin:3px auto 8px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.stop.done b{background:var(--sign);border-color:var(--sign)}
.stop.now{color:var(--ink);font-weight:600}
.stop.now b{width:18px;height:18px;margin:1px auto 6px;border-radius:3px;transform:rotate(45deg);background:var(--amber);border-color:var(--ink);border-width:2px}

.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0}
.specs div{background:var(--surface);padding:9px 12px}
.specs span{display:block;color:var(--muted);font-size:12.5px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.calc div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.calc span{display:block;color:var(--muted);font-size:12.5px}
.calc .num{font-size:22px}
.calc .profit{background:var(--sign);border-color:var(--sign);color:#fff}
.calc .profit span{color:#fff;opacity:.85}
.check{list-style:none;margin:8px 0 0;padding:0}
.check label{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--sign)}
.check small{margin-left:auto;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hint{color:var(--muted);font-size:13.5px;margin-top:10px}

.leads{display:grid;grid-template-columns:320px 1fr;min-height:480px;overflow:hidden}
.lead-list{border-right:1px solid var(--line)}
.lead{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.lead:hover{background:var(--paper)}
.lead[aria-current="true"]{border-left-color:var(--sign);background:var(--paper)}
.lead small{display:block;color:var(--muted);font-size:13px}
.lead .flag{float:right;font-size:12px;font-weight:600;color:var(--muted)}
.lead .flag.wait{color:var(--red)}
.thread{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;background:var(--paper)}
.msg.out{align-self:flex-end;background:var(--sign-soft)}
.msg small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px;font-weight:600}
.card{border:1.5px solid var(--sign);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card span{display:block;color:var(--muted);font-size:12.5px}

.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 18px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar b{width:100%;max-width:54px;background:var(--sign);border-radius:5px 5px 0 0}
.bar.cur b{background:var(--amber)}
.bar span{font-size:12.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;padding:7px 18px}
.hbar i{display:block;height:12px;border-radius:6px;background:var(--sign)}
.hbar i.late{background:var(--red)}
.pad{padding:0 0 12px}

.modal{position:fixed;inset:0;z-index:22;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.sheet{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px 24px}
.vin{display:flex;gap:8px;margin:14px 0}
.vin input{flex:1;min-width:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.08em;padding:8px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--surface)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{font-size:13px;color:var(--muted);display:block}
.form input{display:block;width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);margin-top:3px;color:var(--ink)}
.form input.filled{border-color:var(--sign);background:var(--sign-soft)}
.desc{margin-top:12px;min-height:66px;border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px}

.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 36px))}
.toast{background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 14px;border-left:6px solid var(--amber);animation:in .25s ease}
.toast small{display:block;opacity:.7;font-size:12px;font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.toast{animation:none}}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0}
  .brand,.dealer,.side-foot{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav button{font-size:16px;padding:8px 9px;gap:5px}
  .main{padding:18px 14px 40px}
  h1{font-size:28px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .strip div{border-bottom:1px solid var(--line)}
  .cols,.money,.leads{grid-template-columns:1fr}
  .lead-list{border-right:0;border-bottom:1px solid var(--line)}
  .row.head{display:none}
  .row{grid-template-columns:76px 1fr auto;grid-template-areas:"t n s" "p m a";row-gap:6px}
  .row>:nth-child(1){grid-area:p}.row>:nth-child(2){grid-area:t}.row>:nth-child(3){grid-area:n}
  .row>:nth-child(4){grid-area:m;text-align:left}.row>:nth-child(5){grid-area:a}.row>:nth-child(6),.row>:nth-child(7){display:none}.row>:nth-child(8){grid-area:s}
  .calc{grid-template-columns:1fr 1fr}.specs{grid-template-columns:1fr 1fr}.card{grid-template-columns:1fr 1fr}
  .msg{max-width:92%}.stop{font-size:11px}
}

.nav button{font-size:18px;padding:7px 10px}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.25);margin:8px 10px;width:auto}
.saved{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sign);color:#fff;border-radius:10px;padding:14px 18px;margin-bottom:18px}
.saved .num{font-size:30px;line-height:1}
.saved span{opacity:.9}
.sms{margin:0 18px 18px;background:var(--paper);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14.5px;max-width:460px}
.sms b{display:block;margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:16px 0 4px;overflow-x:auto}
.tabs button{padding:8px 12px;font-family:var(--display);font-size:18px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--sign)}
.shots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.shot{aspect-ratio:4/3;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--muted);padding:4px;line-height:1.2}
.shot.ok{border:1.5px solid var(--sign);background:var(--sign-soft);color:var(--ink);font-weight:600}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:600;border-top:1.5px solid var(--ink)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--sign-soft);border-color:var(--sign)}
.tag.wait{background:var(--amber-soft);border-color:var(--amber)}
.tag.off{color:var(--muted)}
.tag.bad{background:var(--red-soft);border-color:var(--red)}
.qrbox{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px}
.qrbox svg{width:84px;height:84px;flex:none;background:#fff;padding:5px;border-radius:6px}
.market{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:16px 0}
.scale{position:relative;height:8px;border-radius:4px;background:var(--line);margin:26px 0 22px}
.scale i{position:absolute;top:-5px;width:3px;height:18px;background:var(--ink)}
.scale i::after{content:attr(data-l);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;font-style:normal;font-weight:600}
.scale i.avg{background:var(--steel)}
.scale i.avg::after{top:20px;font-weight:400;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:220px}
.kcol h3{font-size:18px;display:flex;justify-content:space-between;padding:2px 4px 8px}
.kcol h3 span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.kcard{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--paper)}
.kcard:hover{border-color:var(--sign)}
.kcard small{display:block;color:var(--muted);font-size:13px}
.kcard .num{font-size:20px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.kv div{background:var(--surface);padding:9px 12px}
.kv span{display:block;color:var(--muted);font-size:12.5px}
.calcbox{border:1.5px solid var(--sign);border-radius:10px;padding:14px 16px;margin:14px 0}
.calcbox label{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.calcbox input[type=range]{width:100%;accent-color:var(--sign)}
.calcbox output{text-align:right;font-family:var(--display);font-weight:600;font-size:18px}
.pay{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.pay .num{font-size:34px}
.prep-card{padding:14px 18px;margin-bottom:14px}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--sign)}
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.crew div{padding:12px 16px}
.crew .num{font-size:28px;line-height:1}
.tl{list-style:none;margin:0;padding:6px 18px 16px}
.tl li{position:relative;padding:0 0 16px 26px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--sign)}
.tl li.later::after{background:var(--surface);border:2.5px solid var(--steel)}
.tl small{display:block;color:var(--muted);font-size:13px}
.rule{display:flex;gap:14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule div{flex:1}
.rule small{display:block;color:var(--muted);font-size:13.5px}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--steel);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--sign)}
.sw[aria-checked="true"]::after{left:21px}
.integ{display:flex;flex-wrap:wrap;gap:8px;padding:4px 18px 18px}
.ba{display:grid;grid-template-columns:1fr 40px 1fr;align-items:stretch;border-bottom:1px solid var(--line)}
.ba:last-child{border-bottom:0}
.ba>div{padding:14px 18px}
.ba .was{color:var(--muted)}
.ba .mid{display:grid;place-items:center;padding:0;color:var(--sign);font-size:20px}
.ba .now{font-weight:600}
.ba.h>div{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink)}
.section{margin-top:18px}

function auto(text,id){
  var w=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  log.unshift({who:me().name,t:text,w:w});S.entries++;
  if(id&&find(id))find(id).hist.unshift([me().name,text.replace(/ (on|of|to|for) stock \d+/,'')]);
  var el=document.createElement('div');el.className='toast';
  el.innerHTML='<small>Saved for the whole team</small>'+me().name+' '+text;
  $('toasts').appendChild(el);
  setTimeout(function(){el.remove()},4200);
}

function nav(){
  var fresh=leads.filter(function(l){return l.st==0}).length;
  var open=trucks.filter(function(t){return t.status=='prep'}).reduce(function(a,t){return a+t.prep.filter(function(x){return !x}).length},0);
  var items=[['dashboard','Today',''],['inventory','Inventory',''],['prep','Prep',open||''],['costs','Costs',''],0,['leads','Leads',fresh||''],['deals','Deals',''],['customers','Customers',''],0,['reports','Reports',''],['team','Team',''],['why','Before and after','']];
  $('nav').innerHTML=items.map(function(i){
    if(!i)return '<hr>';
    return '<button data-act="go" data-v="'+i[0]+'"'+(S.view==i[0]?' aria-current="page"':'')+'>'+i[1]+(i[2]?'<span class="count">'+i[2]+'</span>':'')+'</button>';

}

  else if(a=='publish'){t.status='available';auto('marked stock '+t.id+' as Available',t.id)}
  else if(a=='deposit'){t.status='hold';auto('recorded a deposit on stock '+t.id+', truck is on hold',t.id)}
  else if(a=='sell'){t.status='sold';auto('recorded the sale of stock '+t.id+', profit and commission updated',t.id)}
  else if(a=='deliver'){t.status='delivered';auto('marked stock '+t.id+' as delivered',t.id)}
  else if(a=='drop'){t.ask-=1000;auto('lowered the price of stock '+t.id+' to '+usd(t.ask),t.id)}
  else if(a=='receipt'){var rt=t||trucks.filter(function(x){return x.status=='prep'})[0]||trucks[0];rt.costs.push(['Detailing',D,185]);auto('added a $185 detailing receipt to stock '+rt.id,rt.id)}
  else if(a=='export')auto('exported the report to Excel');
  else if(a=='leadnext'){var l=leads[+b.dataset.i];l.st++;auto('moved '+l.name+' to '+LSTAT[l.st])}
  else if(a=='addlead'){leads.unshift({name:'New buyer',kind:'Owner-operator',truck:9291,src:'Phone',rep:me().role=='Sales rep'?me().name:'Sam Keller',st:0,when:'Just now'});auto('logged a new lead for stock 9291',9291)}
  else if(a=='advance'){var d=deals.filter(function(x){return x.id==S.deal})[0],dt=find(d.truck);d.stage++;
    auto('moved '+d.buyer+' to '+DSTAGE[d.stage]+' on stock '+dt.id,dt.id);
    if(d.stage==2)d.lenders=[['Northline Capital','Reviewing'],['Prairie Equipment Finance','Reviewing']];
    if(d.stage==3&&dt.status=='available')dt.status='hold';
    if(d.stage==4){dt.status='sold';dt.ask=d.price}}
  else if(a=='scan'){
    var vals=[['f-year','2024'],['f-make','Peterbilt'],['f-model','579'],['f-engine','X15, 450 HP'],['f-cab','Sleeper']];
    b.disabled=true;b.textContent='Reading...';
    vals.forEach(function(v,k){setTimeout(function(){var el=$(v[0]);if(!el)return;el.value=v[1];el.classList.add('filled');if(k==vals.length-1)b.textContent='VIN read'},260*(k+1))});
    return;
  }
  else if(a=='shoot'){
    b.disabled=true;var tiles=document.querySelectorAll('#shots .shot');
    tiles.forEach(function(el,k){setTimeout(function(){el.classList.add('ok');el.innerHTML='&#10003; '+SHOTS[k]},180*(k+1))});
    return;
  }
  else if(a=='write'){
    var text='2024 Peterbilt 579 sleeper with the Cummins X15 at 450 HP and an automatic transmission. 338,400 miles, fully inspected, DOT ready and detailed inside and out. Clean title in hand. Financing and warranty available.',el=$('desc'),k=0;
    el.textContent='';b.disabled=true;
    var iv=setInterval(function(){if(!$('desc')){clearInterval(iv);return}k+=4;el.textContent=text.slice(0,k);if(k>=text.length)clearInterval(iv)},16);
    return;
  }
  else if(a=='save'){
    var n=function(id){return +($(id).value.replace(/[^0-9]/g,''))||0};
    var id=7100+Math.floor(Math.random()*800);
    trucks.unshift({id:id,year:+$('f-year').value||2024,make:$('f-make').value||'Peterbilt',model:$('f-model').value||'579',miles:n('f-miles'),engine:'X15',hp:450,trans:'Automatic',ratio:'2.64',cab:$('f-cab').value||'Sleeper',apu:'No',paint:'#5B3E8A',status:'incoming',cost:n('f-cost'),ask:n('f-ask'),days:0,prep:[0,0,0,0,0],views:0,inq:0,costs:[],rep:me().role=='Sales rep'?me().name:'Sam Keller',hist:[]});
    closeModal();S.view='inventory';S.filter='all';S.sel=id;S.tab='overview';
    auto('added stock '+id+' from a VIN scan',id);
  }
  render();
});
document.addEventListener('keydown',function(e){if(e.key=='Escape'){S.sel=null;closeModal();render()}});
render();
</script>
</body>
</html>
